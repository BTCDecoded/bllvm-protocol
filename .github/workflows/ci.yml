name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [published]
  repository_dispatch:
    types: [build-chain, upstream-changed, develop-chain]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution and coverage steps'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '1'

jobs:
  setup:
    name: Setup
    runs-on: [self-hosted, Linux, X64, builds]

    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]')))
    outputs:
      cache-key: ${{ steps.setup-cache.outputs.cache-key }}
    steps:
      - name: Disk check
        uses: BTCDecoded/rust-ci/runner-disk-guard@main

      - uses: actions/checkout@v6
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Cache
        id: setup-cache
        run: |
          CACHE_ROOT="/tmp/runner-cache/${{ github.repository }}"
          
          # Cache key from Cargo.toml + toolchain (root Cargo.lock is not committed per .gitignore).
          DEPS_KEY=$(sha256sum Cargo.toml | cut -d' ' -f1)
          
          # Include toolchain version in cache key
          TOOLCHAIN=$(grep -E '^channel|rust-version' rust-toolchain.toml Cargo.toml 2>/dev/null | head -1 | sha256sum | cut -d' ' -f1 || echo "1.88.0")
          
          CACHE_KEY="${DEPS_KEY}-${TOOLCHAIN}"
          
          # Set up cache directories
          CARGO_CACHE_DIR="$CACHE_ROOT/cargo/$CACHE_KEY"
          TARGET_CACHE_DIR="$CACHE_ROOT/target/$CACHE_KEY"
          
          echo "CARGO_CACHE_DIR=$CARGO_CACHE_DIR" >> $GITHUB_ENV
          echo "TARGET_CACHE_DIR=$TARGET_CACHE_DIR" >> $GITHUB_ENV
          
          echo "cache-key=$CACHE_KEY" >> $GITHUB_OUTPUT
          
          mkdir -p "$CARGO_CACHE_DIR"/{registry,git} "$TARGET_CACHE_DIR"
          

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

  test:
    name: Test
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]

    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       !contains(github.event.head_commit.message, '[skip_tests]')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v6
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Checkout develop scripts (blvm)
        if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
        uses: actions/checkout@v6
        with:
          repository: BTCDecoded/blvm
          ref: ${{ github.ref_name == 'develop' && 'develop' || 'main' }}
          path: _develop-blvm
          fetch-depth: 1

      - name: Resolve develop registry deps (test)
        uses: ./_develop-blvm/.github/actions/develop-resolve-test
        continue-on-error: true
        if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'

      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Compile tests (no-run)
        # Separate compile from execute so CI shows which phase fails.
        # Clippy only checks --lib --bins; test code may have its own errors.
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --lib --tests --no-run

      - name: Run tests
        env:
          CARGO_BUILD_JOBS: '1'
          RUST_BACKTRACE: full
        run: cargo test --lib --tests -- --test-threads=1 --nocapture

      # Protocol-local cfg(feature = "production") (e.g. spam_filter, lib.rs) is not enabled by the
      # default-feature job above; consensus still gets production via blvm-consensus defaults.
      - name: Compile tests with protocol production feature (no-run)
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --lib --tests --features production --no-run

      - name: Run tests with protocol production feature
        env:
          CARGO_BUILD_JOBS: '1'
          RUST_BACKTRACE: full
        run: cargo test --lib --tests --features production -- --test-threads=1 --nocapture
      
      - name: Save Cargo cache
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save

      - name: Prune old runner caches
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: prune

  clippy:
    name: Clippy
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]

    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       !contains(github.event.head_commit.message, '[skip_tests]')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v6
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}
          include-target: false

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Run clippy
        run: |
          if ! cargo clippy --version >/dev/null 2>&1; then
            echo "Skipping Clippy (cargo-clippy not installed for the active toolchain)"
            exit 1
          fi
          cargo clippy --lib --bins -- -D warnings

  fmt:
    name: Format
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]

    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       !contains(github.event.head_commit.message, '[skip_tests]')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v6
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Check formatting
        run: |
          if ! cargo fmt --version >/dev/null 2>&1; then
            echo "Skipping rustfmt (not installed for the active toolchain)"
            exit 0
          fi
          cargo fmt -- --check

  docs:
    name: Docs
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]

    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       !contains(github.event.head_commit.message, '[skip_docs]')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v6
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}
          include-target: false

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Docs
        run: cargo doc --no-deps --document-private-items

  security:
    name: Security
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]

    if: |
      (github.event_name != 'push' || github.event.head_commit == null ||
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       !contains(github.event.head_commit.message, '[skip_tests]')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v6
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      # 0.22+ parses CVSS 4.0 in advisory-db; 0.21 fails loading the DB (e.g. cap-primitives RUSTSEC-2024-0445).
      # --force + PATH: self-hosted runners may have an older system cargo-audit earlier on PATH than ~/.cargo/bin.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked --force
      
      - name: Run security audit
        run: |
          export PATH="${HOME}/.cargo/bin:${PATH}"
          command -v cargo-audit
          cargo-audit --version
          cargo audit

  verify:
    name: Verify (spec-lock)
    needs: setup
    runs-on: [self-hosted, Linux, X64, builds]

    timeout-minutes: 60
    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       !contains(github.event.head_commit.message, '[skip_verify]')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v6

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Clean stale blvm-spec checkout
        run: |
          if [ -d "../blvm-spec" ]; then rm -rf ../blvm-spec; fi

      - name: Setup blvm-spec (PROTOCOL.md + ARCHITECTURE.md for verification)
        uses: BTCDecoded/rust-ci/setup-blvm-spec@main

      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Verify
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          pkg-config --exists z3 || { echo "❌ libz3-dev not found; install z3 on the runner."; exit 1; }
          command -v clang >/dev/null 2>&1 || { echo "❌ clang not found; install clang on the runner."; exit 1; }
          command -v jq >/dev/null 2>&1 || { echo "❌ jq not found; install jq on the runner."; exit 1; }
          echo "✅ Z3 + clang + jq present."

          cargo install blvm-spec-lock --version '>=0.1, <1' --locked --features z3

          if [ -f "../blvm-spec/PROTOCOL.md" ] && [ -f "../blvm-spec/ARCHITECTURE.md" ]; then
            SPEC_PATH_ARGS="--spec-path ../blvm-spec/PROTOCOL.md ../blvm-spec/ARCHITECTURE.md"
            echo "Using PROTOCOL.md + ARCHITECTURE.md for spec-derived contracts"
          elif [ -f "../blvm-spec/THE_ORANGE_PAPER.md" ]; then
            SPEC_PATH_ARGS="--spec-path ../blvm-spec/THE_ORANGE_PAPER.md"
            echo "Using THE_ORANGE_PAPER.md for spec-derived contracts (fallback)"
          else
            echo "❌ No spec found at ../blvm-spec"
            exit 1
          fi

          echo "📎 Running blvm-spec-lock check-drift..."
          SPEC_ARGS="--crate-path . --scoped-unparseables ${SPEC_PATH_ARGS}"
          if cargo-spec-lock check-drift --help 2>&1 | grep -Fq -- '--scoped-formulas'; then
            SPEC_ARGS="--crate-path . --scoped-unparseables --scoped-formulas ${SPEC_PATH_ARGS}"
          fi
          cargo-spec-lock check-drift $SPEC_ARGS 2>&1 | tee spec_lock_drift.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ blvm-spec-lock check-drift failed"
            exit $EXIT_CODE
          fi
          echo "✅ blvm-spec-lock check-drift passed"

          echo "🔒 Running blvm-spec-lock verify on blvm-protocol (merged F_* registry gate + #[spec_locked] Rust rows)..."
          SPEC_ARGS="--crate-path . ${SPEC_PATH_ARGS}"
          export SPEC_LOCK_STRICT=1
          export SPEC_LOCK_Z3_TIMEOUT_SECS="${SPEC_LOCK_Z3_TIMEOUT_SECS:-120}"
          cargo-spec-lock verify $SPEC_ARGS --timeout 120 --format human --json-out spec_lock_verify.json \
            2>&1 | tee spec_lock_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ blvm-spec-lock verification failed"
            exit $EXIT_CODE
          fi
          echo "✅ blvm-spec-lock verification passed"

          set +e
          echo "📎 spec-lock coverage (non-blocking rollup from verify JSON)..."
          COV_ARGS="--crate-path . --format json ${SPEC_PATH_ARGS}"
          COV_ARGS="$COV_ARGS --rollup-from-verify-json spec_lock_verify.json"
          cargo-spec-lock coverage $COV_ARGS | tee spec_lock_coverage.json || echo "⚠️ spec-lock coverage failed (ignored)"
          set -e

      - name: Upload spec-lock coverage JSON (protocol)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: blvm-protocol-spec-lock-coverage-json
          path: spec_lock_coverage.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload spec-lock drift log (protocol)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: blvm-protocol-spec-lock-drift-log
          path: spec_lock_drift.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload spec-lock verify JSON (protocol)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: blvm-protocol-spec-lock-verify-json
          path: spec_lock_verify.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload spec-lock human verify log (protocol)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: blvm-protocol-spec-lock-output
          path: spec_lock_output.txt
          if-no-files-found: ignore
          retention-days: 90

  # Fuzz is skippable via commit message `[skip_fuzz]` on push (build still runs).
  fuzz:
    name: Fuzz
    needs: [setup]
    runs-on: [self-hosted, Linux, X64, builds]

    timeout-minutes: 30
    if: |
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       !contains(github.event.head_commit.message, '[skip_fuzz]')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true')
    steps:
      - uses: actions/checkout@v6

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly
          rustup component add rustfmt --toolchain nightly 2>/dev/null || true
          export PATH="$HOME/.cargo/bin:$PATH"
          # cargo-fuzz 0.13+ MSRV is rustc 1.91; project stable is 1.88. Install the
          # subcommand with nightly (libFuzzer builds already use +nightly).
          command -v cargo-fuzz >/dev/null 2>&1 || cargo +nightly install cargo-fuzz --locked

      - name: Initialize corpus dirs
        working-directory: fuzz
        run: |
          chmod +x init_corpus.sh
          ./init_corpus.sh

      # cargo-fuzz injects sancov + ASAN; do not set RUSTFLAGS here.
      - name: Build fuzz binaries
        working-directory: fuzz
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo +nightly fuzz build

      - name: Run all libFuzzer binaries in parallel
        working-directory: fuzz
        env:
          ASAN_OPTIONS: detect_odr_violation=0
        run: |
          mapfile -t bins < <(grep -v '^#' TARGETS.md | grep -v '^$' || true)
          JOBS=$(nproc)
          echo "Running ${#bins[@]} fuzz targets across $JOBS cores in parallel"
          RUNSCRIPT=$(mktemp /tmp/fuzz-run-XXXXXX.sh)
          cat > "$RUNSCRIPT" << 'SCRIPT'
          #!/usr/bin/env bash
          t=$1
          bin="$PWD/target/x86_64-unknown-linux-gnu/release/$t"
          if [ ! -x "$bin" ]; then echo "❌ missing: $bin"; exit 1; fi
          echo "▶ $t"
          timeout 210 "$bin" "corpus/$t" -- -max_total_time=60 -timeout=10 -max_len=100000 2>&1 | tail -3
          echo "✓ $t"
          SCRIPT
          chmod +x "$RUNSCRIPT"
          printf '%s\n' "${bins[@]}" | xargs -P"$JOBS" -I{} bash "$RUNSCRIPT" {}
          EXIT=$?
          rm -f "$RUNSCRIPT"
          exit $EXIT

      - name: Save Cargo cache
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save

  build:
    name: Build
    needs: 
      - setup
      - test
      - clippy
      - fmt
      - docs
      - security
      - verify
      - fuzz
    runs-on: [self-hosted, Linux, X64, builds]

    if: |
      always() &&
      needs.setup.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]'))) &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') ||
       ((needs.test.result == 'success' || needs.test.result == 'skipped') &&
        (needs.clippy.result == 'success' || needs.clippy.result == 'skipped') &&
        (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
        (needs.docs.result == 'success' || needs.docs.result == 'skipped') &&
        (needs.security.result == 'success' || needs.security.result == 'skipped') &&
        (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
        (needs.fuzz.result == 'success' || needs.fuzz.result == 'skipped')))
    steps:
      - uses: actions/checkout@v6
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: bind-env
          cache-key: ${{ needs.setup.outputs.cache-key }}
      
      - name: Restore Cargo cache
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: restore

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Build
        run: cargo build --release
      
      - name: Save Cargo cache
        if: always()
        uses: BTCDecoded/rust-ci/runner-cargo-cache@main
        with:
          operation: save

  release:
    name: Release
    needs: [build, test, clippy, fmt, docs, security, verify, fuzz]
    runs-on: [self-hosted, Linux, X64, builds]

    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      (github.event_name != 'push' || github.event.head_commit == null || 
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]') &&
        !contains(github.event.head_commit.message, '[skip release]'))) &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') ||
       ((needs.test.result == 'success' || needs.test.result == 'skipped') &&
        (needs.clippy.result == 'success' || needs.clippy.result == 'skipped') &&
        (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
        (needs.docs.result == 'success' || needs.docs.result == 'skipped') &&
        (needs.security.result == 'success' || needs.security.result == 'skipped') &&
        (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
        (needs.fuzz.result == 'success' || needs.fuzz.result == 'skipped')))
    permissions:
      contents: write
      id-token: write
      workflows: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main
      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main
      
      - name: Determine version
        id: version
        run: |
          # Extract current version from [package] section
          CURRENT=$(grep -A 10 '^\[package\]' Cargo.toml | grep '^version = ' | head -1 | sed -E 's/^version = "([^"]+)".*/\1/')
          if [ -z "$CURRENT" ]; then
            echo "❌ Could not determine current version from Cargo.toml"
            grep -A 10 '^\[package\]' Cargo.toml | head -10
            exit 1
          fi
          echo "Current version: ${CURRENT}"
          if ! echo "$CURRENT" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid version format: ${CURRENT} (expected X.Y.Z)"
            exit 1
          fi
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          CURRENT_PATCH=$(echo "$CURRENT" | cut -d. -f3)
          CRATE_NAME=$(grep -A 5 '^\[package\]' Cargo.toml | grep '^name = ' | head -1 | sed -E 's/^name = "([^"]+)".*/\1/')
          echo "Fetching published versions for ${CRATE_NAME} from crates.io..."
          API_RESPONSE=$(curl -sf \
            -H "User-Agent: blvm-ci/1.0 (github.com/BTCDecoded)" \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/versions" 2>/dev/null || echo "")
          PUBLISHED_VERSIONS=""
          if [ -n "$API_RESPONSE" ] && ! echo "$API_RESPONSE" | grep -q '"detail"'; then
            if command -v jq &>/dev/null; then
              PUBLISHED_VERSIONS=$(echo "$API_RESPONSE" | jq -r '.versions[].num' 2>/dev/null || echo "")
            else
              PUBLISHED_VERSIONS=$(echo "$API_RESPONSE" | grep -oE '"num":"[^"]+"' | sed 's/"num":"//;s/"//')
            fi
            echo "Found $(echo "$PUBLISHED_VERSIONS" | wc -l | tr -d ' ') published versions."
          else
            echo "⚠️  crates.io API unavailable — assuming version is free."
          fi
          TAGGED_VERSIONS=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sed 's/-unverified$//')
          USED_VERSIONS=$(printf '%s\n%s' "$TAGGED_VERSIONS" "$PUBLISHED_VERSIONS" | sort -u | grep -v '^$')
          echo "All used versions (tag ∪ crates.io): $(echo "$USED_VERSIONS" | tr '\n' ' ')"
          SAME_LINE_PATCHES=$(printf '%s\n' "$USED_VERSIONS" | grep -E "^${MAJOR}\\.${MINOR}\\.[0-9]+$" | cut -d. -f3 || true)
          MAX_PATCH=$(printf '%s\n' $SAME_LINE_PATCHES "$CURRENT_PATCH" | grep -E '^[0-9]+$' | sort -n | tail -1)
          [ -n "$MAX_PATCH" ] || MAX_PATCH="$CURRENT_PATCH"
          PATCH=$((MAX_PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          while echo "$USED_VERSIONS" | grep -qxF "$VERSION"; do
            echo "⚠️  Version ${VERSION} already exists, incrementing..."
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          done
          echo "✅ Version ${VERSION} is available"
          VERSION_TAG="v${VERSION}"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "✅ Releasing version: ${VERSION_TAG}"
      
      - name: Get latest blvm-consensus version from crates.io
        id: consensus-version
        run: |
          CONSENSUS_VER=$(cargo search blvm-consensus --limit 1 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          if [ -z "$CONSENSUS_VER" ]; then
            echo "ERROR: blvm-consensus not found on crates.io. It must be published first."
            exit 1
          fi
          echo "version=${CONSENSUS_VER}" >> $GITHUB_OUTPUT
          echo "Using blvm-consensus version: ${CONSENSUS_VER}"
      
      - name: Update Cargo.toml to use crates.io dependencies
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CONSENSUS_VER="${{ steps.consensus-version.outputs.version }}"
          
          # Update [package] version only (see blvm-consensus release job; naive sed breaks optional dep pins).
          awk -v ver="$VERSION" '
            /^\[package\]/ { in_package = 1; print; next }
            /^\[/ { in_package = 0 }
            in_package && /^version = / {
              print "version = \"" ver "\""
              next
            }
            { print }
          ' Cargo.toml > Cargo.toml.tmp && mv Cargo.toml.tmp Cargo.toml
          
          # Update blvm-consensus dependency to use crates.io version
          sed -i 's|blvm-consensus = {[^}]*}|blvm-consensus = "'"${CONSENSUS_VER}"'"|g' Cargo.toml
          
          echo "Updated Cargo.toml:"
          echo "  package version: ${VERSION}"
          echo "  blvm-consensus: ${CONSENSUS_VER}"
          grep -A 12 '^\[package\]' Cargo.toml | grep '^version = ' | head -1
          grep '^blvm-consensus = ' Cargo.toml | head -1
      
      - name: Check for crates.io token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "⚠️  CARGO_REGISTRY_TOKEN not set, skipping crate publication"
            echo "   Set CARGO_REGISTRY_TOKEN secret to enable crate publishing"
            exit 0
          fi
      
      - name: Configure cargo for crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo login "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      
      - name: Verify package
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo package --list
      
      - name: Dry-run publish
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish --dry-run --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      
      - name: Check if version already exists
        if: env.CARGO_REGISTRY_TOKEN != ''
        id: check-version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CRATE_NAME=$(grep -E '^name = ' Cargo.toml | sed -E 's/^name = "([^"]+)".*/\1/')
          
          echo "🔍 Checking if ${CRATE_NAME} v${VERSION} already exists on crates.io..."
          
          # Update cargo index first to ensure we have latest data
          cargo update --dry-run 2>/dev/null || true
          
          # Use crates.io API to check if version exists (more reliable than cargo search)
          # The API returns versions in the "versions" array
          API_RESPONSE=$(curl -s "https://crates.io/api/v1/crates/${CRATE_NAME}/versions" 2>/dev/null || echo "")
          
          if [ -z "$API_RESPONSE" ] || echo "$API_RESPONSE" | grep -q '"detail"'; then
            echo "⚠️  Could not check crates.io API (crate may not exist yet), using cargo search as fallback"
            # Fallback to cargo search - check all versions
            SEARCH_OUTPUT=$(cargo search "$CRATE_NAME" --limit 100 2>/dev/null || echo "")
            if echo "$SEARCH_OUTPUT" | grep -qE "\"${CRATE_NAME}\".*\"${VERSION}\""; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "⚠️  Version ${VERSION} already published for ${CRATE_NAME} (found via cargo search)"
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "✅ Version ${VERSION} not yet published for ${CRATE_NAME} (cargo search)"
            fi
          else
            # Show existing versions for debugging
            echo "📋 Existing versions on crates.io:"
            if command -v jq &> /dev/null; then
              echo "$API_RESPONSE" | jq -r ".versions[].num" | head -5
            else
              echo "$API_RESPONSE" | grep -o '"num":"[^"]*"' | sed 's/"num":"\(.*\)"/\1/' | head -5
            fi
            echo ""
            
            # Parse JSON to check if version exists (using jq if available, or grep as fallback)
            if command -v jq &> /dev/null; then
              VERSION_EXISTS=$(echo "$API_RESPONSE" | jq -r ".versions[] | select(.num == \"${VERSION}\") | .num" | head -1)
              if [ "$VERSION_EXISTS" = "$VERSION" ]; then
                echo "exists=true" >> $GITHUB_OUTPUT
                echo "⚠️  Version ${VERSION} already published for ${CRATE_NAME} (found via API)"
              else
                echo "exists=false" >> $GITHUB_OUTPUT
                echo "✅ Version ${VERSION} not yet published for ${CRATE_NAME} (API check)"
              fi
            else
              # Fallback: grep for version in JSON
              if echo "$API_RESPONSE" | grep -q "\"num\":\"${VERSION}\""; then
                echo "exists=true" >> $GITHUB_OUTPUT
                echo "⚠️  Version ${VERSION} already published for ${CRATE_NAME} (found via grep)"
              else
                echo "exists=false" >> $GITHUB_OUTPUT
                echo "✅ Version ${VERSION} not yet published for ${CRATE_NAME} (grep check)"
              fi
            fi
          fi
          
          echo ""
          echo "📊 Version check result: ${{ steps.check-version.outputs.exists }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        id: publish
        run: |
          set +e
          VERSION="${{ steps.version.outputs.version }}"
          CRATE_NAME=$(grep -E '^name = ' Cargo.toml | sed -E 's/^name = "([^"]+)".*/\1/')
          
          echo "🔍 Publish Debug Info:"
          echo "  Version: ${VERSION}"
          echo "  Crate: ${CRATE_NAME}"
          echo "  Version exists check: ${{ steps.check-version.outputs.exists }}"
          
          # Skip if version already exists
          if [ "${{ steps.check-version.outputs.exists }}" = "true" ]; then
            echo "⚠️  Version ${VERSION} already exists on crates.io, skipping publish"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo ""
          echo "📦 Publishing ${CRATE_NAME} v${VERSION} to crates.io..."
          echo "Running: cargo publish --token [REDACTED] --allow-dirty"
          
          # Update cargo index before publishing to ensure we have latest data
          cargo update --dry-run 2>/dev/null || true
          
          PUBLISH_OUTPUT=$(cargo publish --token "${CARGO_REGISTRY_TOKEN}" --allow-dirty 2>&1)
          PUBLISH_EXIT_CODE=$?
          
          echo ""
          echo "📋 Publish Output:"
          echo "$PUBLISH_OUTPUT"
          echo ""
          
          if [ $PUBLISH_EXIT_CODE -eq 0 ]; then
            echo "✅ Successfully published ${CRATE_NAME} v${VERSION}"
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Waiting 30 seconds for crates.io to index..."
            sleep 30
            echo "✅ Publish complete - version should be available on crates.io"
          else
            # Check if error is due to version already existing
            if echo "$PUBLISH_OUTPUT" | grep -qiE "(already exists|already been uploaded|already exists on crates.io)"; then
              echo "⚠️  Version ${VERSION} already exists on crates.io (detected during publish)"
              echo "published=false" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "❌ Failed to publish ${CRATE_NAME} v${VERSION}"
              echo "Exit code: $PUBLISH_EXIT_CODE"
              echo "Error output:"
              echo "$PUBLISH_OUTPUT"
              echo ""
              echo "::error::cargo publish failed — job must fail until this is fixed"
              echo "published=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      
      - name: Verify published crate is available
        if: |
          env.CARGO_REGISTRY_TOKEN != '' &&
          steps.publish.outputs.published == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CRATE_NAME=$(grep -E '^name = ' Cargo.toml | sed -E 's/^name = "([^"]+)".*/\1/')
          echo "Verifying ${CRATE_NAME} v${VERSION} is available on crates.io..."
          
          # Try to fetch the crate info
          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if cargo search "$CRATE_NAME" --limit 1 2>/dev/null | grep -q "v${VERSION}"; then
              echo "✅ ${CRATE_NAME} v${VERSION} is now available on crates.io"
              echo "📦 Crate page: https://crates.io/crates/${CRATE_NAME}/${VERSION}"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⏳ Waiting for crates.io to index (attempt $RETRY_COUNT/$MAX_RETRIES)..."
                sleep 10
              else
                echo "⚠️  ${CRATE_NAME} v${VERSION} not yet visible on crates.io (may take a few minutes)"
              fi
            fi
          done
      
      - name: Create git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Check if tag already exists
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "⚠️  Tag ${VERSION_TAG} already exists, skipping tag creation"
          elif git ls-remote --exit-code --tags origin "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            echo "⚠️  Tag ${VERSION_TAG} already exists on origin, skipping tag creation"
          else
            git tag -a "$VERSION_TAG" -m "Release ${VERSION_TAG}"
            git push origin "$VERSION_TAG"
            echo "✅ Created and pushed tag ${VERSION_TAG}"
          fi
      
      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"
          CRATE_NAME=$(grep -E '^name = ' Cargo.toml | sed -E 's/^name = "([^"]+)".*/\1/')
          DESCRIPTION=$(grep -E '^description = ' Cargo.toml | sed -E 's/^description = "([^"]+)".*/\1/' || echo "Bitcoin protocol abstraction layer")
          
          # Get commit range for this release
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            COMMIT_RANGE="${{ github.event.before }}..${{ github.sha }}"
            COMMIT_COUNT=$(git rev-list --count "$COMMIT_RANGE" 2>/dev/null || echo "?")
          else
            COMMIT_RANGE="HEAD~10..HEAD"
            COMMIT_COUNT="?"
          fi
          
          cat > /tmp/release_notes.md << EOF
          ## $VERSION_TAG
          
          **$DESCRIPTION**
          
          ### 📦 Installation
          
          Add to your \`Cargo.toml\`:
          
          \`\`\`toml
          [dependencies]
          $CRATE_NAME = "$VERSION"
          \`\`\`
          
          Or install via cargo:
          
          \`\`\`bash
          cargo add $CRATE_NAME@$VERSION
          \`\`\`
          
          ### 🔗 Links
          
          - **Crates.io**: [${CRATE_NAME} v${VERSION}](https://crates.io/crates/${CRATE_NAME}/${VERSION})
          - **Documentation**: [docs.rs/${CRATE_NAME}/${VERSION}](https://docs.rs/${CRATE_NAME}/${VERSION})
          - **Repository**: [GitHub](https://github.com/${{ github.repository }})
          
          ### 📝 Changes
          
          This release includes $COMMIT_COUNT commits since the last release.
          
          **Published to crates.io**: ${{ steps.publish.outputs.published == 'true' && '✅ Yes' || '⚠️  Already exists or skipped' }}
          
          See [full commit history](https://github.com/${{ github.repository }}/compare/$COMMIT_RANGE) for details.
          EOF
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: Release ${{ steps.version.outputs.version_tag }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-dev:
    name: Publish develop (crates.io)
    needs: [build, test, clippy, fmt, docs, security, verify, fuzz]
    runs-on: [self-hosted, Linux, X64, builds]

    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'repository_dispatch' && github.event.action == 'develop-chain')
      ) &&
      (github.event_name != 'push' || github.event.head_commit == null ||
       (!contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        !contains(github.event.head_commit.message, '[no ci]') &&
        !contains(github.event.head_commit.message, '[skip release]') &&
        !contains(github.event.head_commit.message, '[skip_publish_dev]'))) &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests == 'true') ||
       ((needs.test.result == 'success' || needs.test.result == 'skipped') &&
        (needs.clippy.result == 'success' || needs.clippy.result == 'skipped') &&
        (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
        (needs.docs.result == 'success' || needs.docs.result == 'skipped') &&
        (needs.security.result == 'success' || needs.security.result == 'skipped') &&
        (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
        (needs.fuzz.result == 'success' || needs.fuzz.result == 'skipped')))
    outputs:
      version: ${{ steps.dev_publish.outputs.version }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      - name: Checkout develop scripts (blvm)
        uses: actions/checkout@v6
        with:
          repository: BTCDecoded/blvm
          ref: ${{ github.ref_name == 'develop' && 'develop' || 'main' }}
          path: _develop-blvm
          fetch-depth: 1

      - name: Check for crates.io token
        id: token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            cargo login "${CARGO_REGISTRY_TOKEN}"
          fi

      - name: Publish develop pre-release
        id: dev_publish
        if: steps.token.outputs.skip != 'true'
        env:
          FORCE_VERSION: ${{ github.event.client_payload.force_version }}
        run: |
          chmod +x _develop-blvm/scripts/*.sh
          if [ -n "${FORCE_VERSION}" ]; then
            V=$(bash _develop-blvm/scripts/compute-develop-version.sh --force-version "${FORCE_VERSION}")
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="${{ github.event.client_payload.version }}"
          else
            V=$(bash _develop-blvm/scripts/compute-develop-version.sh)
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          bash _develop-blvm/scripts/ci-publish-develop.sh \
            --scripts-dir "${GITHUB_WORKSPACE}/_develop-blvm/scripts" \
            --wait-for blvm-consensus \
            "${V}"

